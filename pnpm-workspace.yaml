# Declara onde vivem os pacotes do monorepo.
# Qualquer pasta com package.json dentro desses padrões vira um workspace package.
packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'
# pnpm bloqueia postinstall de deps por padrão (supply-chain); liberamos
# apenas as confiáveis que precisam compilar/baixar binários.
allowBuilds:
  esbuild: true
